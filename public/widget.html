<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekobot Support Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f1016;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }
    
    /* Force Widget to stay open and centered */
    #qontak-chat-widget {
      position: relative !important;
      bottom: auto !important;
      right: auto !important;
      z-index: 1;
    }

    #qontak-chat-button {
      display: none !important; /* Hide trigger button as we force-display window */
    }

    #qontak-chat-window {
      position: relative !important;
      bottom: auto !important;
      right: auto !important;
      width: 450px !important;
      height: 600px !important;
      display: flex !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6) !important;
    }

    .qontak-close {
      display: none !important; /* Hide close button as it is a dedicated page */
    }

    .branding-footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      margin-top: 15px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center;">
    <!-- Qontak-Style Agentic AI Floating Chat Widget -->
    <div id="qontak-chat-widget">
      <!-- Pop-up Chat Window -->
      <div id="qontak-chat-window" class="show">
        <div class="qontak-header">
          <div class="qontak-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="qontak-title">
            <h4>Ekobot Support Agent</h4>
            <span><span class="status-online"></span> Agentic AI Online</span>
          </div>
        </div>
        <div class="qontak-messages" id="qontak-messages">
          <div class="qmsg bot">
            <div class="qmsg-bubble">
              Halo! Saya adalah **Ekobot Agentic AI**.
              <br><br>
              Silakan masukkan NIM Anda terlebih dahulu untuk memulai konsultasi akademik secara langsung.
            </div>
            <div class="qmsg-time">Sekarang</div>
          </div>
        </div>
        <div class="qontak-input-area">
          <input type="text" id="qontak-input" placeholder="Tulis pertanyaan..." onkeypress="handleQontakKeyPress(event)">
          <button class="qontak-send" onclick="sendQontakMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
    <div class="branding-footer">
      &copy; 2026 Tugas Akhir - Novi Trihadi Jayanti (NIM: 200101010060)
    </div>
  </div>

  <script src="app.js"></script>
  <script src="script.js"></script>
</body>
</html>
